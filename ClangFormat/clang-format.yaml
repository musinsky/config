# 2026-08-14
# https://github.com/musinsky/config/blob/master/ClangFormat/clang-format.yaml

# https://muke.saske.sk/wiki/GCC#ClangFormat
#
# $ clang-format path/to/file.c   # '--style=file' by default (in the closest parent dir)
# $ clang-format --style=file:$HOME/.clang-format -i path/to/file.c
#
# $ clang-format --dump-config --style=google                   > clang-format.Google
# $ clang-format --dump-config                                  > clang-format.user
# $ clang-format --dump-config --style=file:$HOME/.clang-format > clang-format.user

# style identical as O2 QualityControl (last edit 2022-03-22)
BasedOnStyle: Google
AllowAllParametersOfDeclarationOnNextLine: false
AllowShortIfStatementsOnASingleLine: Never
AllowShortLoopsOnASingleLine: false
BreakBeforeBraces: Linux
# ColumnLimit: 0
ConstructorInitializerIndentWidth: 2
ContinuationIndentWidth: 2
Cpp11BracedListStyle: Block
IndentWrappedFunctionNames: true
KeepEmptyLinesAtTheStartOfBlocks: true
ObjCSpaceBeforeProtocolList: false
# SortIncludes: false
SpacesBeforeTrailingComments: 1
# Standard: Cpp11
TabWidth: 2

# override option
ColumnLimit: 120
SortIncludes: true
Standard: Latest
# add option
InsertBraces: true
ReflowComments: IndentOnly



# BasedOnStyle: Google                       # Alice O2 style(s) based on Google
# # all AlignConsecutiveXYZ styles are disabled in Google style
# # IndentWidth: 2 in Google style
# AlignConsecutiveAssignments: Consecutive   # Google, O2: None
# AlignTrailingComments: Leave               # Google, O2: Always
# BreakBeforeBraces: Linux                   # Google: Attach, O2: Linux
# ColumnLimit: 120                           # Google: 80, O2: 0
# ConstructorInitializerIndentWidth: 2       # Google: 4,  O2: 2
# ContinuationIndentWidth: 2                 # Google: 4,  O2: 2
# InsertBraces: true                         # Google, O2: false
# # SpacesBeforeTrailingComments ignore if AlignTrailingComments: Leave
# # SpacesBeforeTrailingComments: 1          # Google: 2,  O2: 1
# TabWidth: 2                                # Google: 8,  O2: 2
